server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: "http://pb_website-loki-1:3100/loki/api/v1/push"

scrape_configs:
  - job_name: system-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: "varlogs"
          __path__: /var/log/*.log

  - job_name: docker-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: "docker"
          __path__: /var/lib/docker/containers/*/*.log
