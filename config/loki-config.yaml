auth_enabled: false

common:
  path_prefix: /loki-data

server:
  http_listen_port: 3100

ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: memberlist  # ✅ Changed from `inmemory` to `memberlist` for persistence
      replication_factor: 1
    final_sleep: 0s
  chunk_idle_period: 5m
  chunk_retain_period: 30s

schema_config:
  configs:
    - from: 2024-02-28
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: tsdb-index
    cache_location: tsdb-cache
    cache_ttl: 24h
  filesystem:
    directory: chunks

compactor:
  working_directory: compactor
  compaction_interval: 5m  # ✅ Added to automatically clean up old data

limits_config:
  allow_structured_metadata: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h

memberlist:
  join_members: []  # ✅ Required when using `memberlist`
