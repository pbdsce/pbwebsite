name: PR Quality Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  issue_comment:
    types: [created]

jobs:
  size-label:
    name: Size Labeler
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate changed files
        id: changed-files
        run: |
          CHANGES=$(git diff --name-only --diff-filter=AM ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | wc -l | tr -d ' ')
          echo "changed_files=${CHANGES}" >> $GITHUB_OUTPUT

      - name: Apply size label
        uses: actions/github-script@v6
        env:
          CHANGES: ${{ steps.changed-files.outputs.changed_files }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const size =
              CHANGES <= 9 ? 'XS' :
              CHANGES <= 49 ? 'S' :
              CHANGES <= 199 ? 'M' :
              CHANGES <= 499 ? 'L' : 'XL';
            const labelName = `size-${size}`;

            const labels = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const sizeLabels = labels.data.filter(label => label.name.startsWith('size-'));
            for (const label of sizeLabels) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: label.name
              });
            }

            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName,
                color: '0e8a16'
              });
            } catch (e) {
              if (e.status !== 422) throw e;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [labelName]
            });

  check-merge-commits:
    name: Merge Commit Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Merge Commits
        run: |
          if git log --merges ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} --pretty=format:"%h" | grep -q .; then
            echo "::error::PR contains merge commits. Use rebase instead."
            exit 1
          else
            echo "No merge commits detected."
          fi

  handle-comments:
    name: Handle PR Comments
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    if: github.event_name == 'issue_comment'
    steps:
      - name: Act on PR Comments
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comment = context.payload.comment.body.trim();
            const issueNumber = context.payload.issue.number;

            if (!context.payload.issue.pull_request) return;

            if (comment.toLowerCase().startsWith('/lgtm')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['lgtm']
              });
            } else if (comment.toLowerCase().startsWith('/assign')) {
              const match = comment.match(/\/assign\s+@?(\w+)/);
              if (match) {
                const assignee = match[1];
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  assignees: [assignee]
                });
              }
            }
