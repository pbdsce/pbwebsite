name: PR Size Labeler
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  size-label:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for accurate diff

      - name: Count changed files
        id: count-files
        run: |
          # Count added/modified files (ignores deletions)
          CHANGES=$(git diff --name-only --diff-filter=AM ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | wc -l | tr -d ' ')
          echo "changed_files=$CHANGES" >> $GITHUB_OUTPUT
          echo "Detected $CHANGES file changes"

      - name: Apply size label
        uses: actions/github-script@v7
        env:
          CHANGES: ${{ steps.count-files.outputs.changed_files }}
        with:
          script: |
            // Remove existing size labels
            const labels = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            await Promise.all(
              labels.data
                .filter(label => label.name.startsWith('size-'))
                .map(label => github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: label.name
                }))
            );

            // Add new label
            const size = 
              process.env.CHANGES <= 9 ? 'XS' :
              process.env.CHANGES <= 49 ? 'S' :
              process.env.CHANGES <= 199 ? 'M' :
              process.env.CHANGES <= 499 ? 'L' : 'XL';
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [`size-${size}`]
            });
